about:
  text: "Terricon Events Bot — независимый неофициальный проект и не связан с командой Terricon Valley. Данные о мероприятиях получены из публично доступного API Terricon Valley и могут изменяться. Регистрация проходит по внешней ссылке организатора. Сообщить об ошибке или оставить предложение можно через раздел «Обратная связь». Автор проекта не публикует личные данные."
