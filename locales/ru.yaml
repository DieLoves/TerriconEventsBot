onboarding:
  choose_language: "Выберите язык интерфейса."
  intro: "Terricon Events Bot — афиша мероприятий Terricon Valley в Telegram.\n\n• смотрите актуальные события и архив;\n• подпишитесь на интересные категории — новые события и важные изменения придут сюда;\n• сообщайте об ошибках и идеях через «Обратную связь».\n\nЭто независимый неофициальный проект. Данные берутся из публичного API Terricon Valley. Бот хранит только то, что нужно для работы: язык, настройки, подписки и обращения."
