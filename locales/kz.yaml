onboarding:
  choose_language: "Интерфейс тілін таңдаңыз."
  intro: "Terricon Events Bot — Terricon Valley іс-шараларының Telegram-дағы афишасы.\n\n• алдағы іс-шаралар мен мұрағатты қараңыз;\n• қызықты санаттарға жазылыңыз — жаңа іс-шаралар мен маңызды өзгерістер осында келеді;\n• қателер мен идеялар туралы «Кері байланыс» арқылы хабарлаңыз.\n\nБұл тәуелсіз бейресми жоба. Деректер Terricon Valley-дің ашық API-інен алынады. Бот жұмысқа қажетті деректерді ғана сақтайды: тіл, баптаулар, жазылымдар және өтініштер."
