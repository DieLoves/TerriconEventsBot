about:
  text: "Terricon Events Bot — тәуелсіз бейресми жоба, Terricon Valley командасымен байланысты емес. Іс-шаралар туралы деректер Terricon Valley-дің жалпыға қолжетімді API-інен алынады және өзгеруі мүмкін. Тіркелу ұйымдастырушының сыртқы сілтемесі арқылы өтеді. Қате туралы хабарлау немесе ұсыныс қалдыру үшін «Кері байланыс» бөлімін пайдаланыңыз. Жоба авторы жеке деректерді жарияламайды."
  official_site: "Ресми сайт"
