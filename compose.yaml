name: terricon-events-bot

x-app-environment: &app-environment
  DATABASE_URL: postgresql+asyncpg://terricon:${POSTGRES_PASSWORD:-terricon-local}@db:5432/terricon

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: terricon
      POSTGRES_USER: terricon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terricon-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terricon -d terricon"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build: .
    env_file: .env
    environment: *app-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    env_file: .env
    environment: *app-environment
    init: true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 45s

volumes:
  postgres-data:
